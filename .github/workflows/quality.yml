name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Verify JavaScript toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedNode = "26.2.0"
          $actualNode = (node --version).Trim().TrimStart("v")
          $actualPnpm = (pnpm --version).Trim()

          if ($actualNode -ne $expectedNode) {
            throw "Expected Node.js $expectedNode, got $actualNode"
          }

          if ($actualPnpm -ne "11.15.0") {
            throw "Expected pnpm 11.15.0, got $actualPnpm"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: JavaScript dependency audit
        run: pnpm audit --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm test:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: JavaScript tests
        run: pnpm test

      - name: Build
        run: pnpm build

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build desktop frontend
        run: pnpm build

      - name: Check Windows native target
        run: cargo check -p poietica --all-targets --all-features

      - name: Build Windows desktop binary
        run: pnpm --filter @poietica/desktop exec tauri build --debug --no-bundle

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # rust-toolchain.toml pins the channel; Cargo.toml pins the floor.
          # Assert the resolved compiler satisfies the Cargo rust-version floor
          # instead of hardcoding a version that contradicts both files.
          $pattern = '^rust-version\s*=\s*"([^"]+)"'
          $found = Select-String -Path "Cargo.toml" -Pattern $pattern

          if (-not $found) {
            throw "Could not read rust-version from Cargo.toml"
          }

          $floor = [version]$found.Matches[0].Groups[1].Value
          $actual = [version](((rustc --version).Trim() -split "\s+")[1])

          if ($actual -lt $floor) {
            throw "Rust $actual is below the required floor $floor"
          }

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Verify generated IPC bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo run -p poietica --bin export-ipc-bindings
          git diff --exit-code -- platforms/desktop-ipc/src/generated/ipc-bindings.ts

          if ($LASTEXITCODE -ne 0) {
            throw "Generated IPC bindings are out of date."
          }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
