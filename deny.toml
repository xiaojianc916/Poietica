# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/checks/index.html
# Run locally: cargo deny check

[graph]
all-features = true
no-default-features = false
exclude-dev = false

targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Our own unpublished workspace crates are not subject to license review.
private = { ignore = true }

allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# OpenSSL text is allowed for `ring` only, instead of globally.
exceptions = [
  { crate = "ring", allow = ["OpenSSL"] },
]

# `ring` ships a combined license file; no brittle file hash pinning here,
# otherwise every `ring` bump breaks CI.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = false
wildcards = "deny"
# Internal path dependencies are allowed to use "*" versions.
allow-wildcard-paths = true
highlight = "all"

workspace-default-features = "allow"
external-default-features = "allow"

skip = []
skip-tree = []

deny = [
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "openssl-src" },
  { crate = "native-tls" },
  { crate = "rust-crypto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies, if ever added, must be pinned to an exact revision.
required-git-spec = "rev"

allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]

allow-git = []
