[workspace]
resolver = "3"
members = [
  "agent/persistence/native",
  "agent/runtime/native",
  "apps/desktop/src-tauri",
  "editor/assets/native",
  "editor/extensions/native",
  "editor/persistence/native",
  "platforms/desktop-runtime/native",
]
default-members = [
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Poietica Contributors"]
license = "Apache-2.0"
repository = "https://github.com/xiaojianc916/poietica"
publish = false

[workspace.dependencies]
# Error handling
anyhow = "1.0.98"
log = "0.4.27"
thiserror = "2.0.12"

# Async runtime
async-trait = "0.1.88"
futures = "0.3.31"
tokio = { version = "1.45.1", features = [
  "fs", "io-util", "macros", "process",
  "rt-multi-thread", "signal", "sync", "time",
] }
tokio-util = { version = "0.7.15", features = ["rt"] }

# Serialization and validation
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.13.0"
toml = "0.8.23"
url = { version = "2.5.4", features = ["serde"] }

# Stable identifiers and time
time = { version = "0.3.41", features = [
  "formatting", "macros", "parsing", "serde",
] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }

# File, archive and content-addressed storage
blake3 = "1.8.2"
hex = "0.4.3"
sha2 = "0.10.9"
tempfile = "3.20.0"
walkdir = "2.5.0"
zip = { version = "4.0.0", default-features = false, features = [
  "deflate", "time", "zstd",
] }
zstd = "0.13.3"

# Native file locking and watching
fs2 = "0.4.3"
notify = "8.0.0"

# Plugin signature and integrity verification
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", features = [
  "pkcs8", "rand_core", "serde",
] }
rand = "0.9.1"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["derive"] }

# Observability

# Tauri composition root
tauri = { version = "2.5.1", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.2.0", features = [] }
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.4.0"
tauri-plugin-log = "2.4.0"
tauri-plugin-opener = "2.3.0"
tauri-plugin-os = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-shell = "2.3.0"
tauri-plugin-single-instance = "2.3.0"
tauri-plugin-store = "2.3.0"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-notification = "2.3.0"
tauri-plugin-updater = "2.3.0"
tauri-plugin-window-state = "2.3.0"

# IPC contract generation.
#
# These prerelease versions are deliberately pinned as a compatible set.
# Do not upgrade one of them independently.
specta = { version = "=2.0.0-rc.22", features = [
  "derive",
  "function",
  "serde",
  "serde_json",
  "uuid",
] }

specta-typescript = "=0.0.9"

tauri-specta = { version = "=2.0.0-rc.21", features = [
  "derive",
  "typescript",
] }

# Testing
proptest = "1.7.0"
rstest = "0.25.0"

# Encrypted local storage
#
# SQLCipher is compiled in rather than linked against a system library, so
# every platform gets the same cipher configuration as the tests.
rusqlite = { version = "0.40.1", features = [
  "bundled-sqlcipher-vendored-openssl",
] }

# 钥匙串。它保管的是加密数据库的密钥，不是 API key。
#
# agent/persistence/native/src/key.rs 用它存 SQLCipher 的 32 字节 raw key（服务
# poietica，账户 agent-store）。那把密钥没有第二个可以放的地方：下游是一个加密的
# 库文件，钥匙串在这里是唯一正解，而且丢了就意味着旧库永久打不开。
#
# 它一度也被用来存 API key，那个用法已经删了 —— API key 的落地点是 agent 自己
# config.toml 里的明文字段，我们再存一份副本换不到安全，只换来一处要同步的第二
# 真相。删掉的是那个用法，不是这条依赖。
#
# keyring 4 通过默认的 v1 feature 提供 macOS、Windows 与 *nix 三套凭据存储，v3
# 时代的按平台 feature 已经不存在。全仓库统一用 keyring::v1::Entry。
keyring = { version = "4.1.5", features = [
  "v1",
] }

# ACP SDK。2.0 把 agent 的启动配置从 MCP 的 wire schema（McpServer）换成了 SDK
# 自己的 AcpAgentConfig —— 一个 ACP agent 子进程不是一台 MCP 服务器，它的本地
# 启动参数没有理由绑在 v1 协议 schema 上。
#
# 稳定的协议面仍然是 v1：schema::v1 在 2.0 里原样保留且没有 feature 门；协议 v2
# 是 unstable_protocol_v2 门后的草案，不启用。
#
# 不写等号：1.3.0 上那个 `=` 是本文件里唯一没有理由的锁。三个 specta 的等号要
# 留着 —— 它们是 prerelease，rc 号错配会让 IPC 绑定生成不出来。
agent-client-protocol = "2"

# 让一个裸名字变成一条可启动的路径。手写 PATH × PATHEXT 遍历是这个 crate 的
# 既有职责：Zed 的 11 个 crate 全部依赖它，其中
# crates/project/src/debugger/dap_store.rs 的 which::which_in 与这里同构。
which = "8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "allow"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Lint policy, grouped by intent.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# 真缺陷：不接受豁免。
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_dependencies = "deny"

# panic 纪律：生产代码收紧，#[cfg(test)] 模块内层统一放开。
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"

# 工程卫生。
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
filetype_is_file = "warn"
large_futures = "warn"
lossy_float_literal = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
verbose_file_reads = "warn"

# 刻意关闭：收益低于噪音成本。
#
# as_conversions 一刀切禁止 `as`，而 pedantic 已提供更精确的
# cast_possible_truncation / cast_precision_loss / cast_sign_loss；
# 保留它只会把 `len() as u64` 逼成 try_from 样板。
as_conversions = "allow"
# multiple_inherent_impl 是纯风格偏好，多个 impl 块常常是刻意分组。
multiple_inherent_impl = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"

[profile.dev]
debug = 1
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.test]
debug = 1
incremental = true
opt-level = 1

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
debug = true
lto = "thin"
