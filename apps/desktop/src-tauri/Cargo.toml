[package]
name = "poietica"
default-run = "poietica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "poietica_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[package.metadata]
tauri-build = { version = "2.0" }

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hex.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
uuid.workspace = true
poietica-editor-persistence-native = { path = "../../../editor/persistence/native" }

tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
