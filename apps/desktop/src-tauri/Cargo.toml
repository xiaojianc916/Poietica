[package]
name = "poietica"
default-run = "poietica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "poietica_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[package.metadata]
tauri-build = { version = "2.0" }

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hex.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
uuid.workspace = true
poietica-agent-runtime-native = { path = "../../../agent/runtime/native" }
poietica-agent-persistence-native = { path = "../../../agent/persistence/native" }

# 这份清单与 bootstrap/app.rs 里注册的插件一一对应。
#
# 此前它多出六个：clipboard-manager、fs、opener、process、shell、updater。
# 它们全都没有 init，capabilities/main-window.json 里也没有对应权限，所以连被
# 前端调用的可能都没有 —— 纯粹链进产物的死重量，其中 fs 与 shell 还是 Tauri
# 最敏感的两个能力面，会让每一次依赖审计都停下来问一遍。
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-window-state.workspace = true

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
