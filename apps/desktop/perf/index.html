<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!--
      渲染层的量尺。不参与构建：vite build 的输入只有根目录那份 index.html，
      所以这一页只存在于开发服务器上，发不到用户手里。
    -->
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #status {
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 12px;
        font: 12px/1.6 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        color: #18181b;
        background: #fafafa;
        border-bottom: 1px solid #e4e4e7;
      }

      #root {
        padding: 56px 24px 24px;
        box-sizing: border-box;
      }
    </style>

    <title>Poietica — render measurement</title>
  </head>

  <body>
    <div id="status">booting</div>
    <div id="root"></div>

    <!--
      错误捕获必须先于模块脚本注册，否则 import 期的崩溃只会留下一片白页。
    -->
    <script>
      window.__perfSay = (text) => {
        var status = document.querySelector('#status')

        if (status !== null) {
          status.textContent = text
        }
      }

      window.__perfFail = (reason) => {
        window.__perfError = String(reason)
        window.__perfSay('failed: ' + window.__perfError)
      }

      window.addEventListener('error', (event) => {
        window.__perfFail(event.error ? event.error.stack || event.error.message : event.message)
      })

      window.addEventListener('unhandledrejection', (event) => {
        window.__perfFail(event.reason)
      })
    </script>

    <script src="./main.tsx" type="module"></script>
  </body>
</html>
